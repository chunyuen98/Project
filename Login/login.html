<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Sign In</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- Left: Brand Panel -->
    <div class="brand-panel">
        <div class="brand-logo">Shop<span>Easy</span></div>
        <p class="brand-tagline">Your one-stop shop for everything</p>

        <div class="brand-icon">
            <i class="fas fa-shopping-bag"></i>
        </div>

        <ul class="brand-features">
            <li><i class="fas fa-shipping-fast"></i> Free shipping on orders over $50</li>
            <li><i class="fas fa-undo"></i> Hassle-free 30-day returns</li>
            <li><i class="fas fa-shield-alt"></i> 100% secure checkout</li>
            <li><i class="fas fa-tags"></i> Exclusive deals every day</li>
        </ul>
    </div>

    <!-- Right: Form Panel -->
    <div class="form-panel">
        <div class="form-box">
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to continue to ShopEasy</p>

            <div class="msg hidden" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper has-icon">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper has-icon">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <i class="fas fa-eye toggle-password" id="togglePassword" title="Show/hide password"></i>
                    </div>
                </div>

                <div class="form-row">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit" id="loginBtn">
                    <div class="spinner"></div>
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <div class="divider">or</div>

            <p class="form-footer">
                Don't have an account? <a href="signup.html">Create one free</a>
            </p>
        </div>
    </div>

    <script type="module" src="loginApp.js"></script>
</body>
</html>
